name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Audit pinned requirements and their dependency tree
        run: |
          python -m pip install --disable-pip-version-check "pip-audit==2.10.1"
          pip-audit --strict --requirement requirements.txt
      - name: Run regression and security validation tests
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r requirements.txt
          python -m unittest discover -s tests -v
